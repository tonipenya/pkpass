<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f6f5f1"><title>Pocket — Pass generator</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23274d43'/%3E%3Cpath d='M12 12h16v16H12z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"></head>
<body>
<header><a class="wordmark" href="./" aria-label="Pocket home"><span class="brand-icon">▱</span> pocket<span class="wordmark-dot">.</span></a></header>
<main>
<section class="workspace" aria-label="Pass editor">
<div class="card-area"><div class="card-caption"><button id="background-button" class="quiet"><span id="background-swatch"></span> Card color</button><button id="reset" class="quiet">Reset ↺</button></div>
<article id="pass-card" class="pass-card" aria-label="Editable pass">
<div class="card-top"><button id="logo" class="image-slot logo-slot" aria-label="Upload logo"><span>＋</span><small>LOGO</small></button><button class="text-field organization" data-field="organization"><span class="value">Your brand</span></button><button class="text-field header-field" data-field="header"><span class="label">PASS TYPE</span><span class="value">Member</span></button></div>
<div class="primary-row"><button class="text-field primary" data-field="primary"><span class="label">PASS TITLE</span><span class="value">Pass title</span></button><button id="thumbnail" class="image-slot thumbnail-slot" aria-label="Upload thumbnail"><span>＋</span><small>IMAGE</small></button></div>
<div class="detail-row"><button class="text-field" data-field="secondary"><span class="label">NAME</span><span class="value">Alex Morgan</span></button><button class="text-field" data-field="auxiliary"><span class="label">MEMBER SINCE</span><span class="value">2026</span></button></div>
<div class="perforation"></div><button id="barcode" class="barcode-slot" aria-label="Edit or upload barcode"><span class="sample-barcode" aria-hidden="true"></span><span class="barcode-caption">Add a barcode</span></button>
</article>
<button id="download" class="download">Download pass <span>↓</span></button>
</div>
<aside id="editor" class="editor" aria-live="polite"></aside>
</section>
</main>
<input type="file" id="image-input" accept="image/*" hidden><dialog id="export-dialog"><form id="export-form"><button type="button" id="close-dialog" class="close" aria-label="Close">×</button><h2>Download pass</h2><p>Your text, images, and barcode are sent via Cloudflare to <a href="https://walletmcppass.com/" target="_blank" rel="noreferrer">walletmcppass</a> for signing.</p><p class="small-note">Daily free limits apply. No payment. Downloads expire after one hour.</p><button class="download" id="signed-download" type="submit">Create free pass ↓</button><div id="export-result" hidden><a id="pass-link" class="download" target="_blank" rel="noopener noreferrer">Download .pkpass ↓</a><img id="pass-qr" alt="Scan to open your pass on an iPhone"><p class="small-note">Scan with your iPhone camera.</p></div><p id="export-status" role="status"></p></form></dialog>
<div id="toast" role="status"></div><script type="module" src="/src/main.js"></script></body></html>
